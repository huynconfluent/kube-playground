apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  name: confluent-gateway
  namespace: confluent
spec:
  secretStores:
    - name: file-store
      provider:
        type: Vault
        configSecretRef: gateway-vault-config
  replicas: 1
  image:
    application: confluentinc/cpc-gateway:1.3.0
    init: confluentinc/confluent-init-container:3.3.0
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: gateway.confluentdemo.io
  streamingDomains:
    - name: gateway-sasl-plain-kafka
      type: kafka
      kafkaCluster:
        name: gateway-demo-cluster
        bootstrapServers:
          - id: SASL_SSL
            endpoint: SASL_SSL://kafkabroker.confluent.svc.cluster.local:9995
            tls:
              secretRef: tls-kafkabroker
        nodeIdRanges:
          - name: pool-1
            start: 0
            end: 2
  routes:
    - name: route-1
      endpoint: gateway.confluentdemo.io:9092
      brokerIdentificationStrategy:
        type: port
      streamingDomain:
        name: gateway-sasl-plain-kafka
        bootstrapServerId: SASL_SSL
      security:
        auth: swap
        secretStore: file-store
        client:
          authentication:
            type: scram
            scram:
              alterScramCredentials: true
              admin:
                secretRef: gateway-client-scram-admin
          tls:
            secretRef: tls-gateway
        cluster:
          authentication:
            type: plain
            jaasConfigPassThrough:
              secretRef: gateway-cluster-pjaas
